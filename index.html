<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GeoGuessr</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #080c12;
  --surface: #0f1620;
  --border: #1c2a3a;
  --accent: #f0c040;
  --accent2: #e05a20;
  --correct: #30d080;
  --text: #ddeeff;
  --muted: #4a6a8a;
  --panel-w: 400px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; }
#game { display: grid; grid-template-columns: var(--panel-w) 1fr; height: 100vh; }
#panel { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; z-index: 10; }
#panel-header { padding: 1rem 1.2rem 0.8rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
#panel-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
#stats { display: flex; gap: 1rem; }
.stat { text-align: center; }
.stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--accent); line-height: 1; }
.stat-lbl { font-size: 0.6rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
#photo-wrap { position: relative; flex-shrink: 0; background: #000; min-height: 220px; }
#street-photo { width: 100%; height: 220px; object-fit: cover; display: block; transition: opacity 0.5s; }
#photo-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0a0e1a; font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; color: var(--muted); font-size: 1rem; flex-direction: column; gap: 0.5rem; z-index: 2; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#photo-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 60%, var(--surface)); pointer-events: none; z-index: 1; }
#round-tag { position: absolute; top: 0.7rem; left: 0.7rem; z-index: 3; background: rgba(0,0,0,0.75); border: 1px solid var(--accent); color: var(--accent); font-family: 'Bebas Neue', sans-serif; font-size: 0.8rem; letter-spacing: 2px; padding: 0.2rem 0.6rem; border-radius: 3px; }
#instructions { padding: 0.8rem 1.2rem; font-size: 0.8rem; color: var(--muted); line-height: 1.5; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#instructions span { color: var(--accent); font-weight: 700; }
#guess-btn-wrap { padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#guess-btn { width: 100%; background: linear-gradient(135deg, var(--accent), #c89010); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 3px; border: none; padding: 0.7rem; border-radius: 6px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s; opacity: 0.35; }
#guess-btn.active { opacity: 1; }
#guess-btn.active:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(240,192,64,0.3); }
#pin-status { text-align: center; font-size: 0.7rem; color: var(--muted); margin-top: 0.4rem; letter-spacing: 1px; }
#result-card { display: none; flex-direction: column; gap: 0.7rem; padding: 1rem 1.2rem; flex-shrink: 0; animation: slideUp 0.35s ease; }
@keyframes slideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
#result-verdict { font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; letter-spacing: 3px; }
#result-distance { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
#result-distance strong { color: var(--text); }
#score-bar-label { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--muted); margin-bottom: 0.3rem; letter-spacing: 1px; text-transform: uppercase; }
#score-bar-track { height: 7px; background: var(--border); border-radius: 4px; overflow: hidden; }
#score-bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent2), var(--accent)); width: 0%; transition: width 1s cubic-bezier(.4,0,.2,1); }
#points-earned { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; color: var(--accent); line-height: 1; text-align: center; margin: 0.2rem 0; }
#points-earned span { font-size: 0.9rem; color: var(--muted); }
#next-btn { width: 100%; background: var(--surface); border: 1px solid var(--accent); color: var(--accent); font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 2px; padding: 0.6rem; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
#next-btn:hover { background: rgba(240,192,64,0.08); }
#total-wrap { margin-top: auto; padding: 0.7rem 1.2rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
#total-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
#total-score { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--correct); }
#map-container { position: relative; }
#map { width: 100%; height: 100%; }
#end-screen { display: none; position: fixed; inset: 0; background: rgba(8,12,18,0.97); z-index: 999; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
#end-screen.show { display: flex; }
#end-screen h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
#final-score { font-family: 'Bebas Neue', sans-serif; font-size: 4.5rem; color: var(--accent); line-height: 1; }
#final-score span { font-size: 1rem; color: var(--muted); display: block; text-align: center; font-family: 'Syne', sans-serif; }
#end-grade { font-size: 0.95rem; color: var(--muted); text-align: center; max-width: 300px; line-height: 1.6; }
#end-discord { display: flex; flex-direction: column; gap: 0.5rem; align-items: center; width: 100%; max-width: 320px; }
#end-discord label { font-size: 0.7rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
#end-discord-row { display: flex; gap: 0.5rem; width: 100%; }
#end-discord-username { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.7rem; border-radius: 6px; font-family: 'Syne', sans-serif; font-size: 0.85rem; outline: none; }
#end-discord-username:focus { border-color: var(--accent); }
#end-discord-username::placeholder { color: var(--muted); }
#end-save-btn { background: #5865F2; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
#end-save-status { font-size: 0.75rem; color: var(--correct); display: none; }
#play-again-btn { background: linear-gradient(135deg, var(--accent), #c89010); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 3px; border: none; padding: 0.75rem 2.5rem; border-radius: 6px; cursor: pointer; transition: transform 0.15s; }
#play-again-btn:hover { transform: scale(1.04); }
@media (max-width: 700px) {
  :root { --panel-w: 100%; }
  #game { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  #panel { max-height: 52vh; }
  #street-photo { height: 150px; }
}
</style>
</head>
<body>
<div id="game">
  <div id="panel">
    <div id="panel-header">
      <h1>GeoGuessr</h1>
      <div id="stats">
        <div class="stat"><div class="stat-val" id="round-disp">1</div><div class="stat-lbl">Round</div></div>
        <div class="stat"><div class="stat-val" id="streak-disp">0</div><div class="stat-lbl">Streak</div></div>
      </div>
    </div>
    <div id="photo-wrap">
      <div id="photo-loading"><div class="spinner"></div>Loading photo...</div>
      <img id="street-photo" src="" alt="Guess this location" style="opacity:0"/>
      <div id="photo-overlay"></div>
      <div id="round-tag">ROUND <span id="round-num">1</span></div>
    </div>
    <div id="instructions">
      <span>Drop a pin</span> anywhere on the map to make your guess. Closer = more points — up to <span>5,000</span> per round!
    </div>
    <div id="guess-btn-wrap">
      <button id="guess-btn" onclick="submitGuess()" disabled>PLACE YOUR GUESS</button>
      <div id="pin-status">Click the map to place your pin</div>
    </div>
    <div id="result-card">
      <div id="result-verdict"></div>
      <div id="result-distance"></div>
      <div id="score-bar-wrap">
        <div id="score-bar-label"><span>0</span><span>5,000 pts</span></div>
        <div id="score-bar-track"><div id="score-bar-fill"></div></div>
      </div>
      <div id="points-earned">0 <span>points</span></div>
      <button id="next-btn" onclick="nextRound()">NEXT ROUND →</button>
    </div>
    <div id="total-wrap">
      <div id="total-label">Total Score</div>
      <div id="total-score">0</div>
    </div>
  </div>
  <div id="map-container"><div id="map"></div></div>
</div>
 
<div id="end-screen">
  <h2>Game Over</h2>
  <div id="final-score">0 <span>out of 25,000</span></div>
  <div id="end-grade"></div>
  <div id="end-discord">
    <label>💬 Save score to Discord scoreboard</label>
    <div id="end-discord-row">
      <input id="end-discord-username" type="text" placeholder="Your Discord username"/>
      <button id="end-save-btn" onclick="saveScoreToDiscord()">Save</button>
    </div>
    <div id="end-save-status">✅ Score saved! Use /scoreboard in Discord.</div>
  </div>
  <button id="play-again-btn" onclick="resetGame()">PLAY AGAIN</button>
</div>

    photos:['https://images.unsplash.com/photo-1501594907352-04cda38ebc29?w=800','https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800','https://images.unsplash.com/photo-1534430882403-e92097a7c9c5?w=800','https://images.unsplash.com/photo-1537944434965-cf4679d1a598?w=800','https://images.unsplash.com/photo-1449034446853-66c86144b0ad?w=800']},
];
 
const ROUNDS = 5;
let map, guessMarker, answerMarker, distanceLine;
let currentLocation = null;
let usedIndices = [];
let round = 1, totalScore = 0, streak = 0;
let pinPlaced = false;
 
function initMap() {
  map = L.map('map', { center:[20,0], zoom:2, minZoom:2, maxZoom:18 });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'©OpenStreetMap ©CartoDB', subdomains:'abcd', maxZoom:19
  }).addTo(map);
  map.on('click', onMapClick);
}
 
function makePin(color) {
  return L.divIcon({
    className:'',
    html:`<div style="width:26px;height:26px;background:${color};border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 3px 10px rgba(0,0,0,0.5)"></div>`,
    iconSize:[26,26], iconAnchor:[13,26]
  });
}
 
function onMapClick(e) {
  if (pinPlaced) return;
  if (guessMarker) map.removeLayer(guessMarker);
  guessMarker = L.marker([e.latlng.lat, e.latlng.lng], { icon: makePin('#f0c040') }).addTo(map);
  const btn = document.getElementById('guess-btn');
  btn.disabled = false;
  btn.classList.add('active');
  document.getElementById('pin-status').textContent = 'Pin placed! Hit the button to confirm.';
  document.getElementById('pin-status').style.color = 'var(--accent)';
}
 
function haversineKm(la1,lo1,la2,lo2) {
  const R=6371, dLa=(la2-la1)*Math.PI/180, dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function calcScore(km) {
  if (km < 0.1) return 5000;
  return Math.round(5000 * Math.pow(Math.E, -km / 2000));
}
 
function startRound() {
  pinPlaced = false;
  if (guessMarker)  { map.removeLayer(guessMarker);  guessMarker  = null; }
  if (answerMarker) { map.removeLayer(answerMarker); answerMarker = null; }
  if (distanceLine) { map.removeLayer(distanceLine); distanceLine = null; }
  map.setView([20,0], 2);
 
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('guess-btn-wrap').style.display = 'block';
  const btn = document.getElementById('guess-btn');
  btn.disabled = true;
  btn.classList.remove('active');
  document.getElementById('pin-status').textContent = 'Click the map to place your pin';
  document.getElementById('pin-status').style.color = '';
  document.getElementById('next-btn').textContent = 'NEXT ROUND →';
  document.getElementById('score-bar-fill').style.width = '0%';
 
  if (usedIndices.length >= locations.length) usedIndices = [];
  let idx;
  do { idx = Math.floor(Math.random() * locations.length); } while (usedIndices.includes(idx));
  usedIndices.push(idx);
  currentLocation = locations[idx];
 
  document.getElementById('round-num').textContent = round;
  document.getElementById('round-disp').textContent = round;
 
  const loadingEl = document.getElementById('photo-loading');
  const photoEl   = document.getElementById('street-photo');
  loadingEl.style.display = 'flex';
  photoEl.style.opacity = '0';
 
  // Pick a random photo from this location's pool
  const photoUrl = currentLocation.photos[Math.floor(Math.random() * currentLocation.photos.length)];
  photoEl.onload = () => { loadingEl.style.display = 'none'; photoEl.style.opacity = '1'; };
  photoEl.onerror = () => { loadingEl.innerHTML = '📷 Photo unavailable<br><small style="font-size:0.7rem">Make your best guess!</small>'; };
  photoEl.src = photoUrl;
}
 
function submitGuess() {
  if (!guessMarker) return;
  pinPlaced = true;
  document.getElementById('guess-btn-wrap').style.display = 'none';
 
  const g = guessMarker.getLatLng();
  const km = haversineKm(g.lat, g.lng, currentLocation.lat, currentLocation.lng);
  const pts = calcScore(km);
  totalScore += pts;
  if (pts >= 4000) streak++; else streak = 0;
 
  answerMarker = L.marker([currentLocation.lat, currentLocation.lng], { icon: makePin('#30d080') })
    .addTo(map).bindPopup(`<b>${currentLocation.name}</b>`).openPopup();
  distanceLine = L.polyline([[g.lat,g.lng],[currentLocation.lat,currentLocation.lng]],
    { color:'#f0c040', weight:2, dashArray:'8 5', opacity:0.8 }).addTo(map);
  map.fitBounds(L.latLngBounds([g.lat,g.lng],[currentLocation.lat,currentLocation.lng]), { padding:[60,60] });
 
  const card = document.getElementById('result-card');
  card.style.display = 'flex';
 
  let label, color;
  if      (pts >= 4500) { label='🎯 PERFECT!';  color='var(--correct)'; }
  else if (pts >= 3000) { label='🔥 GREAT!';     color='var(--accent)'; }
  else if (pts >= 1500) { label='👍 NOT BAD!';   color='var(--accent2)'; }
  else                  { label='😬 FAR OFF...'; color='#e05a20'; }
 
  document.getElementById('result-verdict').textContent = label;
  document.getElementById('result-verdict').style.color = color;
  const distStr = km < 1 ? `${Math.round(km*1000).toLocaleString()} meters` : `${Math.round(km).toLocaleString()} km`;
  document.getElementById('result-distance').innerHTML = `You were <strong>${distStr}</strong> away from <strong>${currentLocation.name}</strong>`;
  setTimeout(() => { document.getElementById('score-bar-fill').style.width = (pts/5000*100)+'%'; }, 100);
  document.getElementById('points-earned').innerHTML = `${pts.toLocaleString()} <span>points</span>`;
  document.getElementById('total-score').textContent = totalScore.toLocaleString();
  document.getElementById('streak-disp').textContent = streak;
  if (round >= ROUNDS) document.getElementById('next-btn').textContent = 'SEE RESULTS →';
}
 
function nextRound() {
  if (round >= ROUNDS) { showEndScreen(); return; }
  round++;
  startRound();
}
 
function showEndScreen() {
  document.getElementById('end-screen').classList.add('show');
  document.getElementById('final-score').innerHTML = `${totalScore.toLocaleString()} <span>out of ${(ROUNDS*5000).toLocaleString()}</span>`;
  const pct = totalScore/(ROUNDS*5000);
  let grade;
  if      (pct>=0.9) grade = '🌍 World-class explorer! You really know your geography.';
  else if (pct>=0.7) grade = '✈️ Seasoned traveler! A few more stamps in that passport.';
  else if (pct>=0.5) grade = '🗺️ Getting there! Keep exploring and you\'ll improve fast.';
  else               grade = '🧭 Geography rookie! But hey — now you know where these places are!';
  document.getElementById('end-grade').textContent = grade;
  const saved = localStorage.getItem('geo_discord_username');
  if (saved) document.getElementById('end-discord-username').value = saved;
}
 
function getScores() { try { return JSON.parse(localStorage.getItem('geo_scores') || '{}'); } catch { return {}; } }
function saveScores(s) { try { localStorage.setItem('geo_scores', JSON.stringify(s)); } catch {} }
function saveScoreToDiscord() {
  const username = document.getElementById('end-discord-username').value.trim();
  if (!username) return;
  localStorage.setItem('geo_discord_username', username);
  const scores = getScores();
  if (totalScore > (scores[username] || 0)) { scores[username] = totalScore; saveScores(scores); }
  document.getElementById('end-save-status').style.display = 'block';
  document.getElementById('end-save-btn').textContent = '✅ Saved!';
  document.getElementById('end-save-btn').style.background = '#2d7a4a';
}
 
function checkScoreboardMode() {
  if (new URLSearchParams(window.location.search).get('scoreboard') !== '1') return;
  document.getElementById('game').style.display = 'none';
  const scores = getScores();
  const entries = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const div = document.createElement('div');
  div.style.cssText = 'max-width:500px;margin:4rem auto;padding:2rem;font-family:Syne,sans-serif;';
  div.innerHTML = `
    <h1 style="font-family:'Bebas Neue',sans-serif;font-size:2.5rem;letter-spacing:4px;background:linear-gradient(90deg,#f0c040,#e05a20);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1.5rem;">🏆 SCOREBOARD</h1>
    ${entries.length === 0
      ? '<p style="color:#4a6a8a;">No scores yet. Play a game first!</p>'
      : entries.map(([user,score],i) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:0.8rem 1rem;margin-bottom:0.5rem;background:#0f1620;border:1px solid #1c2a3a;border-radius:8px;">
            <span style="color:${i===0?'#f0c040':i===1?'#aaa':i===2?'#cd7f32':'#ddeeff'};font-weight:700;">${i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`} ${user}</span>
            <span style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#30d080;">${score.toLocaleString()}</span>
          </div>`).join('')}`;
  document.body.appendChild(div);
}
 
function resetGame() {
  round=1; totalScore=0; streak=0; usedIndices=[];
  document.getElementById('end-screen').classList.remove('show');
  document.getElementById('total-score').textContent='0';
  document.getElementById('streak-disp').textContent='0';
  document.getElementById('end-save-btn').textContent='Save';
  document.getElementById('end-save-btn').style.background='#5865F2';
  document.getElementById('end-save-status').style.display='none';
  startRound();
}
 
checkScoreboardMode();
initMap();
startRound();
</script>
